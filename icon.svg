<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cvm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1830"/>
      <stop offset="1" stop-color="#060a15"/>
    </linearGradient>
    <linearGradient id="cvm-cv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="cvm-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#cvm-bg)"/>
  <circle cx="32" cy="32" r="26" fill="url(#cvm-glow)"/>
  <rect x="1.2" y="1.2" width="61.6" height="61.6" rx="12.8" fill="none" stroke="url(#cvm-cv)" stroke-opacity=".5" stroke-width="1.6"/>
  <!-- stars -->
  <circle cx="12" cy="14" r="1.1" fill="#fff" opacity=".7"/>
  <circle cx="18" cy="50" r=".9" fill="#fff" opacity=".5"/>
  <circle cx="54" cy="46" r="1" fill="#fff" opacity=".55"/>
  <!-- orbit rings -->
  <ellipse cx="31" cy="35" rx="23" ry="9.5" fill="none" stroke="#38bdf8" stroke-opacity=".55" stroke-width="1.7" transform="rotate(-22 31 35)"/>
  <ellipse cx="31" cy="35" rx="23" ry="9.5" fill="none" stroke="#a78bfa" stroke-opacity=".4" stroke-width="1.2" transform="rotate(26 31 35)"/>
  <!-- graph-node dots riding the ring -->
  <circle cx="12.5" cy="40.5" r="2.6" fill="#38bdf8"/>
  <circle cx="24" cy="26.5" r="2" fill="#a78bfa"/>
  <!-- planet / core memory node -->
  <circle cx="31" cy="35" r="6.5" fill="url(#cvm-cv)"/>
  <circle cx="29" cy="33" r="1.8" fill="#fff" opacity=".75"/>
  <!-- satellite on the upper ring -->
  <g transform="translate(49 22) rotate(-22)">
    <rect x="-12.5" y="-1.6" width="7" height="3.2" rx=".6" fill="#38bdf8" opacity=".9"/>
    <rect x="5.5" y="-1.6" width="7" height="3.2" rx=".6" fill="#38bdf8" opacity=".9"/>
    <line x1="-10.5" y1="-1.6" x2="-10.5" y2="1.6" stroke="#060a15" stroke-width=".8"/>
    <line x1="10.5" y1="-1.6" x2="10.5" y2="1.6" stroke="#060a15" stroke-width=".8"/>
    <rect x="-4" y="-2.6" width="8" height="5.2" rx="1.2" fill="#e8eef7"/>
    <rect x="-4" y="-2.6" width="8" height="2" rx="1" fill="#a78bfa" opacity=".85"/>
    <line x1="0" y1="-2.6" x2="0" y2="-6.5" stroke="#e8eef7" stroke-width="1.3"/>
    <circle cx="0" cy="-7.5" r="1.3" fill="#fbbf24"/>
  </g>
  <!-- signal ping -->
  <path d="M44.5 12.5 Q49 8 53.5 12.5" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M42 9.5 Q49 3 56 9.5" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity=".6"/>
  <path d="M39.5 6.5 Q49 0 58.5 6.5" fill="none" stroke="#a78bfa" stroke-width="1.3" stroke-linecap="round" opacity=".4"/>
</svg>
